<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    width: 720pt;
    height: 405pt;
    background: linear-gradient(135deg, #000000 0%, #0A0A0A 100%);
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.glow-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00F0FF, transparent);
    animation: pulse 2s ease-in-out infinite;
}

.top-line { top: 60pt; }
.bottom-line { bottom: 60pt; }

@keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

h1 {
    color: #FFFFFF;
    font-size: 52pt;
    font-weight: 300;
    letter-spacing: 4pt;
    margin: 0;
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
}

h2 {
    color: #00F0FF;
    font-size: 28pt;
    font-weight: 300;
    margin: 20pt 0 0 0;
    text-align: center;
    letter-spacing: 2pt;
}

.version {
    position: absolute;
    top: 30pt;
    right: 40pt;
    color: #00F0FF;
    font-size: 14pt;
    font-family: 'Courier New', monospace;
    opacity: 0.8;
}

.tagline {
    position: absolute;
    bottom: 40pt;
    color: #FFFFFF;
    font-size: 16pt;
    opacity: 0.7;
    text-align: center;
    width: 100%;
}
</style>
</head>
<body>
    <div class="glow-line top-line"></div>
    <div class="version">v3.2</div>
    <h1>MARCUS</h1>
    <h2>Enterprise Citation Integrity Platform</h2>
    <div class="tagline">Multi-Agent Research Consensus for Production AI Systems</div>
    <div class="glow-line bottom-line"></div>
</body>
</html>
