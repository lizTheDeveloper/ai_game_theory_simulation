name: MARCUS 3.0 - TypeScript Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/platform/**/*.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/marcus-typescript-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/**/*.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: marcus_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: citation_integrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Run TypeScript tests with coverage
        env:
          DATABASE_URL: postgresql://marcus_test:test_password@localhost:5432/citation_integrity_test
          REDIS_URL: redis://localhost:6379/0
          NODE_ENV: test
        run: |
          npm test -- --coverage --coverageDirectory=coverage-ts

      - name: Check coverage threshold
        run: |
          node -e "
            const coverage = require('./coverage-ts/coverage-summary.json');
            const total = coverage.total;
            const metrics = ['lines', 'statements', 'functions', 'branches'];
            let failed = false;
            metrics.forEach(metric => {
              const pct = total[metric].pct;
              if (pct < 80) {
                console.error(\`❌ ${metric} coverage ${pct}% is below 80% threshold\`);
                failed = true;
              }
            });
            if (failed) process.exit(1);
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage-ts
          flags: typescript-node-${{ matrix.node-version }}
          name: TypeScript Node ${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 20
        with:
          name: coverage-html-typescript
          path: coverage-ts/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage-ts/coverage-summary.json
          retention-days: 7
