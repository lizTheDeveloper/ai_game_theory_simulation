name: Research Age Audit

on:
  # Run every Monday at 8am UTC
  schedule:
    - cron: '0 8 * * 1'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - 'research/**'
      - 'scripts/auditResearchAge.ts'
      - '.github/workflows/research-age-audit.yml'

permissions:
  contents: write  # For committing UPDATE_QUEUE.md
  issues: write    # For creating CRITICAL alerts
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run research age audit
        id: audit
        run: |
          echo "🔍 Running research age audit..."
          npx tsx scripts/auditResearchAge.ts --output research/UPDATE_QUEUE.md 2>&1 | tee audit.log

          # Capture exit code (0=success, 1=critical, 2=high)
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Extract counts from log
          CRITICAL_COUNT=$(grep -oP "CRITICAL: \K\d+" audit.log || echo "0")
          HIGH_COUNT=$(grep -oP "HIGH: \K\d+" audit.log || echo "0")
          MEDIUM_COUNT=$(grep -oP "MEDIUM: \K\d+" audit.log || echo "0")

          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "medium_count=$MEDIUM_COUNT" >> $GITHUB_OUTPUT

          # Upload log as artifact
          cat audit.log
        continue-on-error: true  # Don't fail workflow on exit code 1/2

      - name: Check for CRITICAL items
        id: check_critical
        run: |
          if [ -f research/UPDATE_QUEUE.md ]; then
            # Extract CRITICAL section
            CRITICAL_SECTION=$(sed -n '/## 🚨 CRITICAL/,/^---$/p' research/UPDATE_QUEUE.md)
            echo "$CRITICAL_SECTION" > critical_section.txt

            # Check if there are actual CRITICAL items (not just "✅ No CRITICAL items")
            if echo "$CRITICAL_SECTION" | grep -q "✅ No CRITICAL items"; then
              echo "has_critical=false" >> $GITHUB_OUTPUT
            else
              echo "has_critical=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue for CRITICAL items
        if: steps.check_critical.outputs.has_critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read CRITICAL section
            const criticalSection = fs.readFileSync('critical_section.txt', 'utf8');

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'research-critical,auto-generated',
              per_page: 100
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('CRITICAL: Research sources >5 years old')
            );

            const body = `# 🚨 CRITICAL Research Age Alert

Automated research age audit detected sources >5 years old that are **used in the simulation**.

**SLA:** Update within 1 week

## CRITICAL Items

${criticalSection}

## Next Steps

1. **Research Lead (Cynthia):** Find updated sources
2. **Research Skeptic (Sylvia):** Validate new sources
3. **Update Files:** Follow workflow in \`docs/RESEARCH_PIPELINE.md\`
4. **Run Monte Carlo:** Validate if parameters changed
5. **Close Issue:** When all CRITICAL items resolved

## Resources

- Update workflow: \`docs/RESEARCH_PIPELINE.md\`
- Research standards: \`docs/RESEARCH_STANDARDS.md\`
- Full update queue: \`research/UPDATE_QUEUE.md\`

---

**Auto-generated by Research Age Audit** (${new Date().toISOString()})
`;

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 CRITICAL: Research sources >5 years old',
                body: body,
                labels: ['research', 'critical', 'research-critical', 'auto-generated'],
                assignees: []  # Add assignees if desired
              });
              console.log(`Created new issue #${newIssue.data.number}`);
            }

      - name: Commit UPDATE_QUEUE.md
        run: |
          git config user.name "Research Age Bot"
          git config user.email "bot@simulation.dev"

          if [ -f research/UPDATE_QUEUE.md ]; then
            git add research/UPDATE_QUEUE.md
            git diff --staged --quiet || {
              git commit -m "chore: Weekly research age audit [skip ci]

📊 Research Age Audit Results:
- CRITICAL: ${{ steps.audit.outputs.critical_count }}
- HIGH: ${{ steps.audit.outputs.high_count }}
- MEDIUM: ${{ steps.audit.outputs.medium_count }}

Generated: $(date -u +"%Y-%m-%d %H:%M UTC")
"
              git push
              echo "✅ Committed UPDATE_QUEUE.md"
            } || echo "ℹ️ No changes to commit"
          fi

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-age-audit-log
          path: audit.log
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          echo "## 📊 Research Age Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Priority | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🚨 CRITICAL | ${{ steps.audit.outputs.critical_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ HIGH | ${{ steps.audit.outputs.high_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 MEDIUM | ${{ steps.audit.outputs.medium_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_critical.outputs.has_critical }}" == "true" ]; then
            echo "🚨 **Action Required:** CRITICAL items found. GitHub issue created." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** All sources current or within acceptable thresholds." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full Report:** See \`research/UPDATE_QUEUE.md\`" >> $GITHUB_STEP_SUMMARY

      # Optional: Post to Matrix research channel (if MCP configured)
      # - name: Post to Matrix
      #   if: steps.check_critical.outputs.has_critical == 'true'
      #   run: |
      #     # Use Matrix MCP to post alert
      #     echo "🚨 CRITICAL research updates required"
      #     echo "See GitHub issue for details"
