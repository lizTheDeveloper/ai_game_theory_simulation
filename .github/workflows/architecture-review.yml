# Architecture Review - Automated Quality Gate
#
# PATTERN: Iterative analysis using Claude Code SDK
# - Agent reads multiple files, analyzes system architecture
# - Uses .claude/agents/architecture-skeptic.md agent definition
# - Reviews state propagation, performance, complexity
# - BLOCKS merge if CRITICAL issues found
#
# TRIGGER: PR opened/updated to main branch

name: Architecture Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  architecture-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Analyze Changed Files
        id: changes
        run: |
          # Get list of changed files
          git diff --name-only origin/main...HEAD > changed_files.txt

          # Categorize changes (grep returns empty string if no matches, which is fine)
          SIMULATION_FILES=$(grep "^src/simulation/" changed_files.txt || true)
          PHASE_FILES=$(grep "Phase\.ts$" changed_files.txt || true)
          TYPE_FILES=$(grep "^src/types/" changed_files.txt || true)
          ENGINE_FILES=$(grep "^src/simulation/engine/" changed_files.txt || true)

          # Count files (handle empty strings explicitly)
          if [ -z "$SIMULATION_FILES" ]; then
            SIM_COUNT=0
          else
            SIM_COUNT=$(echo "$SIMULATION_FILES" | grep -c ".")
          fi

          if [ -z "$PHASE_FILES" ]; then
            PHASE_COUNT=0
          else
            PHASE_COUNT=$(echo "$PHASE_FILES" | grep -c ".")
          fi

          if [ -z "$TYPE_FILES" ]; then
            TYPE_COUNT=0
          else
            TYPE_COUNT=$(echo "$TYPE_FILES" | grep -c ".")
          fi

          if [ -z "$ENGINE_FILES" ]; then
            ENGINE_COUNT=0
          else
            ENGINE_COUNT=$(echo "$ENGINE_FILES" | grep -c ".")
          fi

          echo "sim_count=$SIM_COUNT" >> $GITHUB_OUTPUT
          echo "phase_count=$PHASE_COUNT" >> $GITHUB_OUTPUT
          echo "type_count=$TYPE_COUNT" >> $GITHUB_OUTPUT
          echo "engine_count=$ENGINE_COUNT" >> $GITHUB_OUTPUT

          # Save file lists for agent
          echo "$SIMULATION_FILES" > simulation_files.txt
          echo "$PHASE_FILES" > phase_files.txt
          echo "$TYPE_FILES" > type_files.txt

      - name: Write PR Body to File
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prBody = context.payload.pull_request.body || '';
            fs.writeFileSync('pr_body_safe.txt', prBody, 'utf8');

      - name: Get PR Context
        id: pr_context
        run: |
          # Get git diff stats
          git diff --stat origin/main...HEAD > diff_stats.txt

      - name: Build Architecture Review Prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SIM_COUNT: ${{ steps.changes.outputs.sim_count }}
          PHASE_COUNT: ${{ steps.changes.outputs.phase_count }}
          TYPE_COUNT: ${{ steps.changes.outputs.type_count }}
          ENGINE_COUNT: ${{ steps.changes.outputs.engine_count }}
        run: |
          # Build prompt template (quoted heredoc prevents ALL expansion)
          cat > architecture_review_prompt.txt <<'TEMPLATE_EOF'
          You are the architecture-skeptic agent from .claude/agents/architecture-skeptic.md

          **YOUR CONTEXT:**
          - PR: PR_TITLE_PLACEHOLDER
          - Branch: PR_BRANCH_PLACEHOLDER
          - You have NO prior conversation history (fresh agent instance)

          **PR DESCRIPTION:**
          PR_BODY_PLACEHOLDER

          **CHANGED FILES:**
          - Simulation files: SIM_COUNT_PLACEHOLDER
          - Phase files: PHASE_COUNT_PLACEHOLDER
          - Type files: TYPE_COUNT_PLACEHOLDER
          - Engine files: ENGINE_COUNT_PLACEHOLDER

          **FILE LISTS:**
          Simulation: SIMULATION_FILES_PLACEHOLDER
          Phases: PHASE_FILES_PLACEHOLDER
          Types: TYPE_FILES_PLACEHOLDER

          **YOUR TASK:**
          Perform a critical architecture review of this PR. Focus on:

          ### 1. State Propagation Analysis
          - Read changed files and trace how state flows
          - Check for missing state updates in related systems
          - Verify phase execution order handles new state
          - Look for stale data from missed updates

          ### 2. Performance Complications
          - Identify O(n²) operations in hot paths
          - Check for deep cloning in loops
          - Look for unnecessary array operations
          - Flag memory allocation patterns

          ### 3. System Complexity
          - Assess if new code increases cognitive load
          - Check for competing/duplicate systems
          - Verify consistency with existing patterns
          - Look for tight coupling between systems

          ### 4. Integration Points
          - Read related files (not just changed files)
          - Check if changes require updates elsewhere
          - Verify phase registration if new phase added
          - Check wiki documentation consistency

          **SEVERITY LEVELS:**
          Use these severity levels in your report:

          - **CRITICAL:** Breaks simulation, causes data loss, or major performance regression
          - **HIGH:** Creates subtle bugs, complicates future work, or minor performance issues
          - **MEDIUM:** Code quality concerns, maintainability issues
          - **LOW:** Style suggestions, minor improvements

          **OUTPUT FORMAT:**
          Create a detailed review report with:

          1. **Summary** (2-3 sentences)
          2. **Issues Found** (grouped by severity, with file:line references)
          3. **Recommendations** (specific, actionable fixes)
          4. **Verdict:** APPROVE / REQUEST CHANGES / BLOCK MERGE

          **VERDICT LOGIC:**
          - BLOCK MERGE: Any CRITICAL issues found
          - REQUEST CHANGES: HIGH severity issues found
          - APPROVE: Only MEDIUM/LOW issues or none

          **IMPORTANT:** Write your complete review report to a file named `review.md` using the Write tool.

          Work iteratively. Read multiple files to understand system context. This is a quality gate - be thorough but fair.
          TEMPLATE_EOF

          # Replace placeholders with actual values using sed
          # Use | as delimiter to avoid issues with / in paths
          sed -i'' -e "s|PR_TITLE_PLACEHOLDER|$PR_TITLE|g" architecture_review_prompt.txt
          sed -i'' -e "s|PR_BRANCH_PLACEHOLDER|$PR_BRANCH|g" architecture_review_prompt.txt
          sed -i'' -e "s|SIM_COUNT_PLACEHOLDER|$SIM_COUNT|g" architecture_review_prompt.txt
          sed -i'' -e "s|PHASE_COUNT_PLACEHOLDER|$PHASE_COUNT|g" architecture_review_prompt.txt
          sed -i'' -e "s|TYPE_COUNT_PLACEHOLDER|$TYPE_COUNT|g" architecture_review_prompt.txt
          sed -i'' -e "s|ENGINE_COUNT_PLACEHOLDER|$ENGINE_COUNT|g" architecture_review_prompt.txt

          # Replace PR body placeholder with file contents (using perl for multi-line)
          perl -i -pe 'BEGIN{undef $/;} s/PR_BODY_PLACEHOLDER/`cat pr_body_safe.txt`/smge' architecture_review_prompt.txt

          # Replace file list placeholders with file contents
          perl -i -pe 'BEGIN{undef $/;} s/SIMULATION_FILES_PLACEHOLDER/`cat simulation_files.txt`/smge' architecture_review_prompt.txt
          perl -i -pe 'BEGIN{undef $/;} s/PHASE_FILES_PLACEHOLDER/`cat phase_files.txt`/smge' architecture_review_prompt.txt
          perl -i -pe 'BEGIN{undef $/;} s/TYPE_FILES_PLACEHOLDER/`cat type_files.txt`/smge' architecture_review_prompt.txt

      - name: Read Architecture Review Prompt
        id: read_prompt
        run: |
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          cat architecture_review_prompt.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Architecture Review (Claude Code SDK)
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.read_prompt.outputs.prompt }}
          show_full_output: true
          claude_args: |
            --max-turns 30
            --dangerously-skip-permissions

      - name: Extract Review Verdict
        id: verdict
        run: |
          # Check if review file exists (fail loudly if Claude Code SDK failed)
          if [ ! -f "review.md" ]; then
            echo "❌ Error: review.md not found - Claude Code SDK failed to generate review"
            exit 1
          fi

          # Look for verdict in Claude's output
          if grep -q "BLOCK MERGE" review.md; then
            echo "verdict=BLOCK" >> $GITHUB_OUTPUT
            echo "severity=CRITICAL" >> $GITHUB_OUTPUT
          elif grep -q "REQUEST CHANGES" review.md; then
            echo "verdict=REQUEST" >> $GITHUB_OUTPUT
            echo "severity=HIGH" >> $GITHUB_OUTPUT
          else
            echo "verdict=APPROVE" >> $GITHUB_OUTPUT
            echo "severity=OK" >> $GITHUB_OUTPUT
          fi

          # Count issues by severity (using grep | wc -l to avoid exit code 1 on 0 matches)
          CRITICAL=$(grep "CRITICAL:" review.md | wc -l)
          HIGH=$(grep "HIGH:" review.md | wc -l)
          MEDIUM=$(grep "MEDIUM:" review.md | wc -l)
          LOW=$(grep "LOW:" review.md | wc -l)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');

            const verdict = '${{ steps.verdict.outputs.verdict }}';
            const critical = parseInt('${{ steps.verdict.outputs.critical }}');
            const high = parseInt('${{ steps.verdict.outputs.high }}');
            const medium = parseInt('${{ steps.verdict.outputs.medium }}');
            const low = parseInt('${{ steps.verdict.outputs.low }}');

            let emoji = '✅';
            let status = 'Approved';
            if (verdict === 'BLOCK') {
              emoji = '❌';
              status = 'Blocked - Critical Issues';
            } else if (verdict === 'REQUEST') {
              emoji = '⚠️';
              status = 'Changes Requested';
            }

            const body = `## ${emoji} Architecture Review - ${status}

            **Issues Found:**
            - 🔴 CRITICAL: ${critical}
            - 🟠 HIGH: ${high}
            - 🟡 MEDIUM: ${medium}
            - ⚪ LOW: ${low}

            ---

            ${review}

            ---
            🤖 Automated by architecture-skeptic agent via Claude Code SDK`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Add Labels
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.verdict.outputs.verdict }}';
            const labels = [];

            if (verdict === 'BLOCK') {
              labels.push('architecture-review-blocked');
              labels.push('needs-fixes');
            } else if (verdict === 'REQUEST') {
              labels.push('architecture-review-changes-requested');
            } else {
              labels.push('architecture-review-approved');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }

      - name: Block Merge if Critical Issues
        if: steps.verdict.outputs.verdict == 'BLOCK'
        run: |
          echo "❌ CRITICAL issues found. Merge blocked."
          echo "Fix all CRITICAL issues before merging."
          exit 1
