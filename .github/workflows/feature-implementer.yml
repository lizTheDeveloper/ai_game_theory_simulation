# Feature Implementer - Automated Implementation via Claude Code SDK
#
# PATTERN: Iterative agent using Claude Code SDK (NOT raw API)
# - Agent can read/edit/test files iteratively
# - Uses .claude/agents/feature-implementer.md agent definition
# - Gets original prompt + current diff as starting context
# - Runs Monte Carlo validation after each phase
#
# TRIGGER: Label "ready-for-implementation" on issue
# REQUIRES: Research + plan files exist (validated in feature-approved.yml)

name: Feature Implementer

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Only run if labeled "ready-for-implementation" by owner OR by feature-approved workflow
    if: |
      github.event.label.name == 'ready-for-implementation' &&
      (github.event.sender.login == github.repository_owner ||
       github.actor == 'github-actions[bot]')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Feature Information
        id: feature
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Remove invalid git branch characters: : ? * [ ] ~ ^ \ and consecutive dots
          # Replace spaces and dashes with single dash, convert to lowercase
          FEATURE_NAME=$(echo "$TITLE" | \
            sed 's/^Feature: //g' | \
            tr -d ':?*[]~^\\' | \
            sed 's/ /-/g' | \
            sed 's/--*/-/g' | \
            tr '[:upper:]' '[:lower:]')

          echo "name=$FEATURE_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Get Issue Body
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const fs = require('fs');
            fs.writeFileSync('issue_body.txt', issue.data.body || '', 'utf8');

      - name: Find Implementation Plan
        id: plan
        run: |
          ISSUE_BODY=$(cat issue_body.txt)

          # Extract plan file path from issue body (from backticks, strip leading slash)
          PLAN_FILE=$(echo "$ISSUE_BODY" | grep "/plans/" | head -1 | sed -n 's/.*`\(\/plans\/[^`]*\.md\)`.*/\1/p' | sed 's|^/||')

          if [ -z "$PLAN_FILE" ] || [ ! -f "$PLAN_FILE" ]; then
            echo "❌ No implementation plan found in issue body or file doesn't exist"
            echo "Looking for backtick-quoted path like: \`/plans/feature-plan.md\`"
            exit 1
          fi

          echo "path=$PLAN_FILE" >> $GITHUB_OUTPUT

          # Read plan content
          PLAN_CONTENT=$(cat "$PLAN_FILE")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checkout Feature Branch
        run: |
          BRANCH_NAME="feature/${{ steps.feature.outputs.name }}"

          # Check if branch exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Implementation Prompt
        id: prompt
        run: |
          # Build minimal context for fresh agent instance
          cat > implementation_prompt.txt << 'EOF'
          You are the feature-implementer agent from .claude/agents/feature-implementer.md

          **YOUR CONTEXT:**
          - Feature name: ${{ steps.feature.outputs.title }}
          - Implementation plan: ${{ steps.plan.outputs.path }}
          - Current branch: feature/${{ steps.feature.outputs.name }}
          - You have NO prior conversation history (fresh agent instance)

          **IMPLEMENTATION PLAN:**
          ${{ steps.plan.outputs.content }}

          **YOUR TASK:**
          Implement this feature following the plan. You should:

          1. **Phase-based implementation:** Implement in phases as defined in the plan
          2. **After each phase:**
             - Run `npx tsc --noEmit` to check types
             - Run `npm test` to verify tests pass
             - Run Monte Carlo validation: `npx tsx scripts/monteCarloSimulation.ts --runs=10 --max-months=60`
             - Commit changes with descriptive message
          3. **Create state types:** Add to src/types/[system].ts
          4. **Create system module:** Add to src/simulation/[system].ts
          5. **Create phase:** Add to src/simulation/engine/phases/[System]Phase.ts
          6. **Register phase:** Update src/simulation/engine/phases/index.ts
          7. **Add logging:** Use console.log with clear prefixes
          8. **Update wiki:** Add system documentation to docs/wiki/README.md

          **QUALITY STANDARDS:**
          - All mechanics must cite peer-reviewed research (check /research/ files)
          - No "TODO" comments (track in issues instead)
          - No console.logs in production code (only for debugging)
          - Use RNG function, never Math.random()
          - Follow existing patterns in similar phases

          **VALIDATION REQUIREMENTS:**
          - TypeScript must compile (0 errors)
          - Tests must pass
          - Monte Carlo run (N=10) must complete without crashes
          - Check logs for unexpected behavior

          **WHEN COMPLETE:**
          1. Update MASTER_IMPLEMENTATION_ROADMAP.md (mark feature complete)
          2. Move plan to /plans/completed/
          3. Report completion status

          Work iteratively. Use Read/Edit/Bash tools as needed. This is a GitHub Actions environment - you have full access to the codebase.
          EOF

      - name: Read Implementation Prompt
        id: read_prompt
        run: |
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          cat implementation_prompt.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Feature Implementer (Claude Code SDK)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.read_prompt.outputs.prompt }}
          claude_args: |
            --max-turns 100
            --agents feature-implementer
            --dangerously-skip-permissions

      - name: Check Implementation Status
        id: status
        run: |
          # Check if implementation completed successfully
          if npx tsc --noEmit; then
            echo "typescript=PASS" >> $GITHUB_OUTPUT
          else
            echo "typescript=FAIL" >> $GITHUB_OUTPUT
          fi

          # Check if test script exists
          if npm run | grep -q "^\s*test$"; then
            # Test script exists, run it
            if npm test; then
              echo "tests=PASS" >> $GITHUB_OUTPUT
            else
              echo "tests=FAIL" >> $GITHUB_OUTPUT
            fi
          else
            # No test script - treat as pass (rely on TypeScript compilation only)
            echo "tests=PASS" >> $GITHUB_OUTPUT
            echo "⚠️ No test script found - skipping tests"
          fi

      - name: Create Pull Request
        if: steps.status.outputs.typescript == 'PASS' && steps.status.outputs.tests == 'PASS'
        run: |
          # Get diff summary
          DIFF_SUMMARY=$(git diff origin/main...HEAD --stat)

          # Create PR
          gh pr create \
            --title "feat: ${{ steps.feature.outputs.title }}" \
            --body "$(cat <<'EOF'
          ## Automated Implementation

          This PR was generated by the feature-implementer agent.

          **Feature:** ${{ steps.feature.outputs.title }}
          **Plan:** ${{ steps.plan.outputs.path }}
          **Issue:** #${{ github.event.issue.number }}

          ### Changes

          \`\`\`
          $DIFF_SUMMARY
          \`\`\`

          ### Validation

          - ✅ TypeScript compiles (0 errors)
          - ✅ Tests pass
          - ⏳ Monte Carlo validation (check logs)
          - ⏳ Architecture review required

          ### Next Steps

          1. ⏳ architecture-skeptic review will run automatically
          2. 👤 Manual review required before merge
          3. ⏳ Senior dev checklist will run on PR

          ---
          🤖 Generated by feature-implementer agent via Claude Code SDK

          **Original Prompt:**
          ${{ steps.plan.outputs.path }}
          EOF
          )" \
            --base main \
            --head "feature/${{ steps.feature.outputs.name }}" \
            --label "automated-implementation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const typescript = '${{ steps.status.outputs.typescript }}';
            const tests = '${{ steps.status.outputs.tests }}';

            let body = '## 🤖 Feature Implementer - Status Update\n\n';

            if (typescript === 'PASS' && tests === 'PASS') {
              body += '✅ **Implementation Complete**\n\n';
              body += '- ✅ TypeScript compiles\n';
              body += '- ✅ Tests pass\n';
              body += '- ✅ PR created: #TODO (link)\n\n';
              body += '**Next:** architecture-skeptic review will run automatically on the PR.\n';
            } else {
              body += '❌ **Implementation Failed**\n\n';
              body += `- ${typescript === 'PASS' ? '✅' : '❌'} TypeScript compilation\n`;
              body += `- ${tests === 'PASS' ? '✅' : '❌'} Tests\n\n`;
              body += '**Action Required:** Check workflow logs and fix errors.\n';
            }

            body += '\n---\n🤖 Automated by feature-implementer agent';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Check Continuation Need
        id: continuation
        if: steps.status.outputs.typescript == 'PASS' && steps.status.outputs.tests == 'PASS'
        run: |
          # Get recent commits to see what was accomplished
          RECENT_COMMITS=$(git log --oneline -10 || echo "No commits found")

          # Get acceptance criteria from plan file
          PLAN_CONTENT=$(cat "${{ steps.plan.outputs.path }}" || echo "Plan not found")

          # Save context for Claude API call
          cat > continuation_check_context.txt <<EOF
          You are evaluating if a feature implementation is complete.

          **Feature:** ${{ steps.feature.outputs.title }}
          **Plan:** ${{ steps.plan.outputs.path }}

          **Recent commits (last 10):**
          $RECENT_COMMITS

          **Implementation plan:**
          $PLAN_CONTENT

          **Question:** Based on the commits and acceptance criteria in the plan, is this implementation COMPLETE?

          Answer with EXACTLY ONE WORD:
          - "COMPLETE" if all acceptance criteria are met and implementation is done
          - "INCOMPLETE" if more work is needed to meet acceptance criteria
          - "UNCERTAIN" if you cannot determine from the commits

          Answer:
          EOF

          echo "context_ready=true" >> $GITHUB_OUTPUT

      - name: Evaluate Completion Status
        id: evaluate
        if: steps.continuation.outputs.context_ready == 'true'
        run: |
          # Call Claude API to evaluate completion
          CONTEXT=$(cat continuation_check_context.txt)

          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "content-type: application/json" \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d "{
              \"model\": \"claude-sonnet-4-5-20250929\",
              \"max_tokens\": 50,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": $(echo "$CONTEXT" | jq -Rs .)
              }]
            }")

          # Extract completion status from response
          STATUS=$(echo "$RESPONSE" | jq -r '.content[0].text' | tr '[:lower:]' '[:upper:]' | grep -oE '(COMPLETE|INCOMPLETE|UNCERTAIN)' | head -1)

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Completion status: $STATUS"

      - name: Check Retry Count
        id: retry
        if: steps.evaluate.outputs.status == 'INCOMPLETE' || steps.evaluate.outputs.status == 'UNCERTAIN'
        uses: actions/github-script@v7
        with:
          script: |
            // Get current issue labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            // Check for auto-retry-N labels
            const retryLabels = issue.data.labels
              .map(l => l.name)
              .filter(name => name.startsWith('auto-retry-'));

            let retryCount = 0;
            if (retryLabels.length > 0) {
              // Extract highest retry number
              const numbers = retryLabels.map(label => {
                const match = label.match(/auto-retry-(\d+)/);
                return match ? parseInt(match[1]) : 0;
              });
              retryCount = Math.max(...numbers);
            }

            const maxRetries = 3; // Limit to 3 auto-retries
            core.setOutput('count', retryCount);
            core.setOutput('should_retry', retryCount < maxRetries ? 'true' : 'false');
            core.setOutput('next_count', retryCount + 1);

      - name: Trigger Continuation
        if: steps.retry.outputs.should_retry == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const nextCount = '${{ steps.retry.outputs.next_count }}';
            const status = '${{ steps.evaluate.outputs.status }}';

            // Comment about continuation
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔄 Auto-Continuation Triggered (Retry ${nextCount}/3)\n\n` +
                    `**Status:** ${status}\n` +
                    `**Reason:** Implementation appears incomplete based on acceptance criteria.\n\n` +
                    `Starting next iteration to continue implementation...\n\n` +
                    `---\n🤖 Automated continuation by feature-implementer workflow`
            });

            // Add retry label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [`auto-retry-${nextCount}`]
            });

            // Remove and re-add ready-for-implementation to trigger new run
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'ready-for-implementation'
            });

            // Wait 5 seconds to ensure label removal is processed
            await new Promise(resolve => setTimeout(resolve, 5000));

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-for-implementation']
            });

      - name: Max Retries Reached
        if: steps.retry.outputs.should_retry == 'false' && (steps.evaluate.outputs.status == 'INCOMPLETE' || steps.evaluate.outputs.status == 'UNCERTAIN')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Maximum Auto-Retries Reached\n\n` +
                    `The implementation appears incomplete, but the maximum number of ` +
                    `automatic retries (3) has been reached.\n\n` +
                    `**Next Steps:**\n` +
                    `1. Review the implementation progress in the commits\n` +
                    `2. Check the acceptance criteria in the plan\n` +
                    `3. Manually continue implementation or adjust the plan\n` +
                    `4. Remove auto-retry labels and re-add 'ready-for-implementation' ` +
                    `to trigger a fresh start if needed\n\n` +
                    `---\n🤖 Automated by feature-implementer workflow`
            });
