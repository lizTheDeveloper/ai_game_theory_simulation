global:
  rotation_strategy: token-aware
  retry_on_provider_failure: true
  log_provider_switches: true
  tier_selection_strategy: auto
providers:
  - name: groq
    enabled: true
    priority: 1
    api_endpoint: https://api.groq.com/openai/v1/chat/completions
    api_key_env: GROQ_API_KEY
    models:
      small_7b:
        model_name: llama-3.1-8b-instant
        tier: 7b
        tokens_per_request_avg: 800
        use_cases:
          - simple_weight_updates
          - routine_checks
          - threshold_evaluations
      medium_70b:
        model_name: llama-3.1-70b-versatile
        tier: 70b
        tokens_per_request_avg: 1200
        use_cases:
          - strategic_planning
          - crisis_response
          - technology_deployment
      large_70b:
        model_name: llama-3.1-70b-versatile
        tier: 70b
        tokens_per_request_avg: 1500
        use_cases:
          - complex_reasoning
          - extinction_scenarios
          - long_term_strategy
    limits:
      requests_per_minute: 30
      requests_per_hour: 500
      requests_per_day: 14400
      tokens_per_minute: 6000
      tokens_per_day: 1000000
    queue:
      max_concurrent: 2
      retry_on_failure: true
      max_retries: 3
      retry_delay_ms: 1000
    temperature: 0.3
    max_tokens: 500
  - name: openai-free
    enabled: true
    priority: 2
    api_endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    models:
      small_7b:
        model_name: gpt-4o-mini
        tier: 7b
        tokens_per_request_avg: 600
        use_cases:
          - simple_weight_updates
          - routine_checks
          - threshold_evaluations
      medium_20b:
        model_name: gpt-4o-mini
        tier: 20b
        tokens_per_request_avg: 1000
        use_cases:
          - strategic_planning
          - crisis_response
          - technology_deployment
      large_100b:
        model_name: gpt-4o
        tier: 100b
        tokens_per_request_avg: 1800
        use_cases:
          - complex_reasoning
          - extinction_scenarios
          - long_term_strategy
    limits:
      requests_per_minute: 3
      requests_per_hour: 200
      requests_per_day: 0
      tokens_per_minute: 40000
      tokens_per_hour: 0
      tokens_per_day: 1000000
    queue:
      max_concurrent: 1
      retry_on_failure: true
      max_retries: 5
      retry_delay_ms: 2000
    temperature: 0.3
    max_tokens: 500
  - name: lm-studio
    enabled: true
    priority: 99
    api_endpoint: http://localhost:1234/v1/chat/completions
    api_key_env: null
    models:
      small_7b:
        model_name: qwen/qwen2.5-7b-instruct
        tier: 7b
        tokens_per_request_avg: 800
        use_cases:
          - simple_weight_updates
      medium_32b:
        model_name: qwen/qwen3-32b
        tier: 32b
        tokens_per_request_avg: 1200
        use_cases:
          - strategic_planning
          - crisis_response
      large_70b:
        model_name: qwen/qwen2.5-72b-instruct
        tier: 70b
        tokens_per_request_avg: 1500
        use_cases:
          - complex_reasoning
    limits:
      requests_per_minute: 0
      requests_per_hour: 0
      requests_per_day: 0
      tokens_per_minute: 0
      tokens_per_day: 0
    queue:
      max_concurrent: 1
      retry_on_failure: true
      max_retries: 2
      retry_delay_ms: 500
    temperature: 0.3
    max_tokens: 500
usage_tracking:
  groq:
    '2025-10-22':
      requests: 1
      tokens: 800
      tokens_input: 500
      tokens_output: 300
