server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s

scrape_configs:
  # MARCUS Platform Logs (TypeScript Orchestrator)
  - job_name: marcus-platform
    static_configs:
      - targets:
          - localhost
        labels:
          job: marcus-platform
          component: orchestrator
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/marcus/platform-*.log

    pipeline_stages:
      # Parse JSON structured logs
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: time
            component: component
            trace_id: trace_id
            span_id: span_id
            duration: duration
            error: error

      # Extract labels from JSON
      - labels:
          level:
          component:
          trace_id:

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339

      # Drop debug logs in production
      - match:
          selector: '{level="debug", environment="prod"}'
          action: drop

  # Citation Agent Logs (Python)
  - job_name: citation-agents
    static_configs:
      - targets:
          - localhost
        labels:
          job: citation-agents
          component: agent
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/marcus/agent-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            timestamp: timestamp
            agent_id: agent_id
            citation_id: citation_id
            behavior: behavior
            integrity: integrity

      - labels:
          level:
          agent_id:

      - timestamp:
          source: timestamp
          format: RFC3339

  # Database Logs (PostgreSQL)
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          component: database
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/postgresql/*.log

    pipeline_stages:
      # Parse PostgreSQL log format
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>\w+):\s+(?P<msg>.*?)(?:\s+DETAIL:\s+(?P<detail>.*?))?(?:\s+HINT:\s+(?P<hint>.*?))?$'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'

      # Alert on slow queries
      - match:
          selector: '{job="postgresql"} |~ "duration: [0-9]{3,}\\.[0-9]{3} ms"'
          stages:
            - labels:
                slow_query: "true"

  # Redis Logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          component: cache
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/redis/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w+) (?P<timestamp>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>[\*\#\.\-]) (?P<msg>.*)$'

      - labels:
          level:
          role:

      - timestamp:
          source: timestamp
          format: '02 Jan 2006 15:04:05.000'

  # Security Audit Logs
  - job_name: security-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: security-audit
          component: security
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/marcus/audit-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            event_type: event_type
            timestamp: timestamp
            user_id: user_id
            ip_address: ip_address
            resource: resource
            action: action
            result: result

      - labels:
          event_type:
          user_id:
          result:

      - timestamp:
          source: timestamp
          format: RFC3339

      # Never drop audit logs, even debug
      - match:
          selector: '{job="security-audit"}'
          action: keep

  # Application Error Logs (High Priority)
  - job_name: error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: error-logs
          component: errors
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/marcus/error-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: timestamp
            error: error
            stack: stack
            component: component

      - labels:
          level:
          component:

      - timestamp:
          source: timestamp
          format: RFC3339

  # System/Container Logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          component: container
          environment: ${ENVIRONMENT:-dev}
          __path__: /var/log/containers/*.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time

      - labels:
          stream:

      - timestamp:
          source: time
          format: RFC3339

      - output:
          source: log

# Log retention and cleanup
limits_config:
  readline_rate: 10000
  readline_burst: 20000
