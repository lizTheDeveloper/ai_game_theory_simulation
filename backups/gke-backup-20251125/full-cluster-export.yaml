- apiVersion: v1
  data:
    prometheus.yml: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        # Orchestrator metrics
        - job_name: 'orchestrator'
          static_configs:
            - targets: ['orchestrator.marcus-platform.svc.cluster.local:9090']
              labels:
                service: 'orchestrator'

        # Citation worker metrics
        - job_name: 'citation-workers'
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - marcus-platform
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: keep
              regex: citation-worker
            - source_labels: [__meta_kubernetes_pod_ip]
              target_label: __address__
              replacement: '$1:9091'

        # Redis queue exporter
        - job_name: 'redis-queue-exporter'
          static_configs:
            - targets: ['redis-queue-exporter.marcus-platform.svc.cluster.local:9121']
              labels:
                service: 'redis-queue'

        # Redis metrics (if exposed)
        - job_name: 'redis'
          static_configs:
            - targets: ['redis.marcus-platform.svc.cluster.local:6379']
              labels:
                service: 'redis'

        # Kubernetes pod discovery for any service with prometheus.io/scrape annotation
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - marcus-platform
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"prometheus.yml":"global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n\nscrape_configs:\n  # Orchestrator metrics\n  - job_name: 'orchestrator'\n    static_configs:\n      - targets: ['orchestrator.marcus-platform.svc.cluster.local:9090']\n        labels:\n          service: 'orchestrator'\n\n  # Citation worker metrics\n  - job_name: 'citation-workers'\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names:\n            - marcus-platform\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        action: keep\n        regex: citation-worker\n      - source_labels: [__meta_kubernetes_pod_ip]\n        target_label: __address__\n        replacement: '$1:9091'\n\n  # Redis queue exporter\n  - job_name: 'redis-queue-exporter'\n    static_configs:\n      - targets: ['redis-queue-exporter.marcus-platform.svc.cluster.local:9121']\n        labels:\n          service: 'redis-queue'\n\n  # Redis metrics (if exposed)\n  - job_name: 'redis'\n    static_configs:\n      - targets: ['redis.marcus-platform.svc.cluster.local:6379']\n        labels:\n          service: 'redis'\n\n  # Kubernetes pod discovery for any service with prometheus.io/scrape annotation\n  - job_name: 'kubernetes-pods'\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names:\n            - marcus-platform\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n        action: replace\n        target_label: __metrics_path__\n        regex: (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement: $1:$2\n        target_label: __address__\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"prometheus-config","namespace":"marcus-platform"}}
