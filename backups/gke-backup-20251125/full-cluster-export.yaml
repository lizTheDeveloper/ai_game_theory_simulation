- apiVersion: v1
  data:
    redis.conf: |
      # Redis cluster configuration
      cluster-enabled yes
      cluster-require-full-coverage no
      cluster-node-timeout 5000
      cluster-migration-barrier 1

      # Persistence
      appendonly yes
      appendfsync everysec
      auto-aof-rewrite-percentage 100
      auto-aof-rewrite-min-size 64mb

      # Performance
      maxmemory 768mb
      maxmemory-policy allkeys-lru
      tcp-backlog 511
      timeout 0
      tcp-keepalive 300

      # Logging
      loglevel notice
      logfile ""

      # Security (password set via command line args)
      protected-mode yes
