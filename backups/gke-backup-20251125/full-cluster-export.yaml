- apiVersion: v1
  data:
    README.md: |
      # Citation Worker HPA Configuration

      ## Scaling Behavior

      **Scale-Up Triggers:**
      1. Queue depth > 10 items per worker (PRIMARY)
      2. Queue latency > 30 seconds
      3. CPU utilization > 70%
      4. Memory utilization > 80%

      **Scale-Down Triggers:**
      1. Queue depth < 10 items per worker
      2. Queue latency < 30 seconds
      3. CPU utilization < 70%
      4. Memory utilization < 80%

      **Scaling Limits:**
      - Min workers: 2
      - Max workers: 50
      - Scale-up: +100% (double) or +5 pods per 30s (whichever is larger)
      - Scale-down: -25% or -2 pods per 60s (whichever is smaller)

      ## Monitoring

      **Key Metrics:**
      - `redis_queue_depth`: Items in queue per worker
      - `redis_queue_latency_seconds`: Age of oldest queued item
      - `worker_throughput_per_second`: Citations processed/sec
      - `worker_saturation_ratio`: Queue depth / throughput

      **Dashboards:**
      - Grafana: MARCUS Worker Scaling Dashboard
      - Prometheus: http://prometheus:9090/graph

      ## Testing

      **Simulate Load Spike:**
      ```bash
      # Add 1000 tasks to queue
      kubectl exec -it redis-0 -n marcus-platform -- redis-cli LPUSH citation_tasks $(seq 1 1000)

      # Watch HPA scale up
      kubectl get hpa citation-workers-hpa -n marcus-platform --watch
      ```

      **Verify Scaling:**
      ```bash
      # Check current worker count
      kubectl get pods -n marcus-platform -l app=citation-worker

      # Check HPA status
      kubectl describe hpa citation-workers-hpa -n marcus-platform

      # View queue metrics
      kubectl port-forward svc/redis-queue-exporter 9121:9121 -n marcus-platform
      curl http://localhost:9121/metrics | grep citation
      ```

      ## Tuning Parameters

      **Environment Variables:**
      - `REDIS_POOL_SIZE`: Redis connection pool size (default: 20)
      - `WORKER_CONCURRENCY`: Concurrent tasks per worker (default: 4)
      - `QUEUE_POLL_INTERVAL`: Queue polling interval (default: 1s)

      **HPA Tuning:**
      - Adjust `averageValue` in metrics to change sensitivity
      - Modify `stabilizationWindowSeconds` to prevent flapping
      - Change `minReplicas`/`maxReplicas` based on workload

      ## Troubleshooting

      **Workers not scaling up:**
      1. Check Prometheus Adapter: `kubectl logs -n kube-system deploy/prometheus-adapter`
      2. Verify metrics available: `kubectl get apiservice v1beta1.external.metrics.k8s.io`
      3. Check HPA status: `kubectl describe hpa citation-workers-hpa -n marcus-platform`

      **Workers scaling down too fast:**
      1. Increase `stabilizationWindowSeconds` for scale-down
      2. Decrease scale-down `value` percentage
      3. Check if queue is truly empty or just drained temporarily

      **Queue depth not decreasing:**
      1. Check worker logs for errors: `kubectl logs -l app=citation-worker -n marcus-platform`
      2. Verify workers are processing: Check `worker_throughput_per_second` metric
      3. Check if workers are CPU/memory bound
