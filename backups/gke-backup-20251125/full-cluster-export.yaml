- apiVersion: v1
  data:
    config.yaml: |
      rules:
        # HTTP requests per second
        - seriesQuery: 'http_requests_total{namespace="marcus-platform"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            matches: "^(.*)_total$"
            as: "http_requests_per_second"
          metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[1m])'

        # Active citations being processed
        - seriesQuery: 'active_citations{namespace="marcus-platform"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            as: "active_citations_count"
          metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

        # Agent queue depth
        - seriesQuery: 'agent_queue_depth{namespace="marcus-platform"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            as: "agent_queue_depth"
          metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

        # Agent response time p95
        - seriesQuery: 'agent_response_time_seconds{namespace="marcus-platform", quantile="0.95"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            matches: "^(.*)_seconds$"
            as: "agent_response_time_p95_seconds"
          metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

        # Database connection pool usage
        - seriesQuery: 'db_pool_active_connections{namespace="marcus-platform"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            as: "db_pool_active_connections"
          metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

        # Redis memory usage
        - seriesQuery: 'redis_memory_used_bytes{namespace="marcus-platform"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
            as: "redis_memory_used_megabytes"
          metricsQuery: '<<.Series>>{<<.LabelMatchers>>} / 1048576'

        # Error rate
        - seriesQuery: 'http_requests_total{namespace="marcus-platform", status=~"5.."}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              pod: {resource: "pod"}
          name:
