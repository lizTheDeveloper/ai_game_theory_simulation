# ============================================================================
# IMPORTANT: This is a template for secrets.
# In production, use:
# - Kubernetes Secrets (with encryption at rest enabled)
# - External Secrets Operator + Vault
# - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager)
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: citation-platform-secrets
  labels:
    app: citation-platform
type: Opaque
stringData:
  # PostgreSQL
  postgres-database: citation_platform
  postgres-user: citation_platform
  postgres-password: CHANGE_ME_IN_PRODUCTION

  # Redis
  redis-password: CHANGE_ME_IN_PRODUCTION

  # API Security
  api-key: CHANGE_ME_IN_PRODUCTION
  jwt-secret: CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS

---
