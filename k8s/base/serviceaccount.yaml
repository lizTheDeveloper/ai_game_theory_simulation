apiVersion: v1
kind: ServiceAccount
metadata:
  name: citation-platform-api
  labels:
    app: citation-platform
    component: api
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: citation-platform-api-role
  labels:
    app: citation-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: citation-platform-api-rolebinding
  labels:
    app: citation-platform
subjects:
- kind: ServiceAccount
  name: citation-platform-api
  namespace: default
roleRef:
  kind: Role
  name: citation-platform-api-role
  apiGroup: rbac.authorization.k8s.io
