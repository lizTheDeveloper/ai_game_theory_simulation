---
# MARCUS 3.1 - Automated Secret Rotation CronJob
#
# Rotates JWT secrets, database passwords, and Redis passwords automatically.
#
# Schedule: Daily check, rotates every 30 days
# Grace Period: 7 days for old secrets
# Audit: All rotations logged to stdout (captured by GKE logging)
#
# Author: Marcus (Platform Engineer)
# Date: 2025-11-22

apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  namespace: marcus
  labels:
    app: marcus
    component: security
    managed-by: platform-engineering
spec:
  # Run daily at 2 AM UTC
  schedule: "0 2 * * *"

  # Keep last 3 successful jobs for audit trail
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Don't allow concurrent rotation jobs
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Clean up completed jobs after 1 hour
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app: marcus
            component: secret-rotation
        spec:
          serviceAccountName: secret-rotation-sa
          restartPolicy: OnFailure

          containers:
          - name: rotation-job
            image: gcr.io/PROJECT_ID/marcus-secret-rotation:latest
            imagePullPolicy: Always

            env:
            # JWT Rotation Config
            - name: JWT_ROTATION_INTERVAL_DAYS
              value: "30"
            - name: JWT_GRACE_PERIOD_DAYS
              value: "7"

            # Database Rotation Config
            - name: DB_ROTATION_ENABLED
              value: "true"
            - name: DB_PASSWORD_COMPLEXITY
              value: "32"  # 32-byte passwords

            # Redis Rotation Config
            - name: REDIS_ROTATION_ENABLED
              value: "true"
            - name: REDIS_PASSWORD_COMPLEXITY
              value: "32"

            # Kubernetes Secret Names
            - name: JWT_SECRET_NAME
              value: "jwt-secrets"
            - name: DB_SECRET_NAME
              value: "postgres-credentials"
            - name: REDIS_SECRET_NAME
              value: "redis-credentials"

            # Namespace
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Audit Logging
            - name: AUDIT_LOG_LEVEL
              value: "info"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alerting-credentials
                  key: slack-webhook-url
                  optional: true

            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"

            # Security context
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL

---
# Service Account for Secret Rotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotation-sa
  namespace: marcus
  labels:
    app: marcus
    component: security

---
# Role for Secret Management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
  namespace: marcus
  labels:
    app: marcus
    component: security
rules:
# Read/Write secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]

# Read deployments (to trigger rolling restart)
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "patch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-rotation-binding
  namespace: marcus
  labels:
    app: marcus
    component: security
subjects:
- kind: ServiceAccount
  name: secret-rotation-sa
  namespace: marcus
roleRef:
  kind: Role
  name: secret-manager
  apiGroup: rbac.authorization.k8s.io

---
# ConfigMap for Rotation Script
apiVersion: v1
kind: ConfigMap
metadata:
  name: rotation-scripts
  namespace: marcus
  labels:
    app: marcus
    component: security
data:
  rotate-jwt.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "🔐 Starting JWT secret rotation..."

    # Get current secret
    CURRENT_SECRET=$(kubectl get secret ${JWT_SECRET_NAME} -n ${K8S_NAMESPACE} -o jsonpath='{.data.current-secret}' | base64 -d)
    CURRENT_TIMESTAMP=$(kubectl get secret ${JWT_SECRET_NAME} -n ${K8S_NAMESPACE} -o jsonpath='{.data.rotation-timestamp}' | base64 -d)

    # Calculate days since rotation
    CURRENT_TS=$(date -d "${CURRENT_TIMESTAMP}" +%s)
    NOW_TS=$(date +%s)
    DAYS_SINCE=$((($NOW_TS - $CURRENT_TS) / 86400))

    echo "Days since last rotation: ${DAYS_SINCE}"

    if [ ${DAYS_SINCE} -ge ${JWT_ROTATION_INTERVAL_DAYS} ]; then
      echo "⚠️ Rotation required (>= ${JWT_ROTATION_INTERVAL_DAYS} days)"

      # Generate new secret (256 bits base64)
      NEW_SECRET=$(openssl rand -base64 32)
      NEW_TIMESTAMP=$(date -Iseconds)

      # Update secret (current → previous, new → current)
      kubectl patch secret ${JWT_SECRET_NAME} -n ${K8S_NAMESPACE} --type=json -p="[
        {\"op\": \"replace\", \"path\": \"/data/previous-secret\", \"value\": \"$(echo -n ${CURRENT_SECRET} | base64 -w0)\"},
        {\"op\": \"replace\", \"path\": \"/data/current-secret\", \"value\": \"$(echo -n ${NEW_SECRET} | base64 -w0)\"},
        {\"op\": \"replace\", \"path\": \"/data/rotation-timestamp\", \"value\": \"$(echo -n ${NEW_TIMESTAMP} | base64 -w0)\"}
      ]"

      echo "✅ JWT secrets rotated successfully"
      echo "📝 New rotation timestamp: ${NEW_TIMESTAMP}"

      # Trigger rolling restart of deployments
      kubectl rollout restart deployment/orchestrator -n ${K8S_NAMESPACE}

      # Send audit notification
      if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
        curl -X POST ${SLACK_WEBHOOK_URL} -H 'Content-Type: application/json' -d "{
          \"text\": \"🔐 MARCUS JWT secrets rotated\",
          \"attachments\": [{
            \"color\": \"good\",
            \"fields\": [
              {\"title\": \"Timestamp\", \"value\": \"${NEW_TIMESTAMP}\", \"short\": true},
              {\"title\": \"Days Since Last\", \"value\": \"${DAYS_SINCE}\", \"short\": true},
              {\"title\": \"Grace Period\", \"value\": \"${JWT_GRACE_PERIOD_DAYS} days\", \"short\": true}
            ]
          }]
        }"
      fi
    else
      echo "✅ JWT secrets healthy (${DAYS_SINCE}/${JWT_ROTATION_INTERVAL_DAYS} days)"
    fi

  rotate-db.sh: |
    #!/bin/bash
    set -euo pipefail

    if [ "${DB_ROTATION_ENABLED}" != "true" ]; then
      echo "⏭️ Database rotation disabled"
      exit 0
    fi

    echo "🗄️ Starting database password rotation..."

    # Get current password
    CURRENT_PW=$(kubectl get secret ${DB_SECRET_NAME} -n ${K8S_NAMESPACE} -o jsonpath='{.data.password}' | base64 -d)

    # Generate new password
    NEW_PW=$(openssl rand -base64 ${DB_PASSWORD_COMPLEXITY})

    # Update Cloud SQL password (using gcloud)
    gcloud sql users set-password postgres \
      --instance=marcus-postgres \
      --password="${NEW_PW}"

    # Update Kubernetes secret
    kubectl patch secret ${DB_SECRET_NAME} -n ${K8S_NAMESPACE} --type=json -p="[
      {\"op\": \"replace\", \"path\": \"/data/password\", \"value\": \"$(echo -n ${NEW_PW} | base64 -w0)\"}
    ]"

    echo "✅ Database password rotated"

    # Trigger rolling restart with new password
    kubectl rollout restart statefulset/postgres -n ${K8S_NAMESPACE}

  rotate-redis.sh: |
    #!/bin/bash
    set -euo pipefail

    if [ "${REDIS_ROTATION_ENABLED}" != "true" ]; then
      echo "⏭️ Redis rotation disabled"
      exit 0
    fi

    echo "🔴 Starting Redis password rotation..."

    # Generate new password
    NEW_PW=$(openssl rand -base64 ${REDIS_PASSWORD_COMPLEXITY})

    # Update Redis config
    kubectl exec statefulset/redis -n ${K8S_NAMESPACE} -- redis-cli CONFIG SET requirepass "${NEW_PW}"

    # Update Kubernetes secret
    kubectl patch secret ${REDIS_SECRET_NAME} -n ${K8S_NAMESPACE} --type=json -p="[
      {\"op\": \"replace\", \"path\": \"/data/password\", \"value\": \"$(echo -n ${NEW_PW} | base64 -w0)\"}
    ]"

    echo "✅ Redis password rotated"

    # Trigger rolling restart
    kubectl rollout restart statefulset/redis -n ${K8S_NAMESPACE}

---
# Initial JWT Secret (create manually on first deploy)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: marcus
  labels:
    app: marcus
    component: security
type: Opaque
data:
  # Base64-encoded values (update these on deployment)
  current-secret: ""  # openssl rand -base64 32 | base64 -w0
  previous-secret: ""
  rotation-timestamp: ""  # date -Iseconds | base64 -w0

---
# Prometheus Alert Rules for Secret Expiration
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-expiration-alerts
  namespace: marcus
  labels:
    app: marcus
    component: monitoring
data:
  secret-alerts.yaml: |
    groups:
    - name: secret_expiration
      interval: 1h
      rules:

      # JWT Secret Rotation Overdue
      - alert: JWTSecretRotationOverdue
        expr: |
          (time() - kube_secret_created{secret="jwt-secrets"}) > (35 * 24 * 3600)
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: "JWT secrets not rotated in 35+ days"
          description: "JWT secrets should be rotated every 30 days. Last rotation was {{ $value | humanizeDuration }} ago."

      # JWT Secret Rotation CRITICAL Overdue
      - alert: JWTSecretRotationCritical
        expr: |
          (time() - kube_secret_created{secret="jwt-secrets"}) > (60 * 24 * 3600)
        for: 1h
        labels:
          severity: critical
          component: security
        annotations:
          summary: "JWT secrets not rotated in 60+ days (CRITICAL)"
          description: "JWT secrets are severely overdue for rotation. Last rotation was {{ $value | humanizeDuration }} ago."

      # Secret Rotation Job Failed
      - alert: SecretRotationJobFailed
        expr: |
          kube_job_failed{job_name=~"secret-rotation-.*"} > 0
        for: 5m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Secret rotation job failed"
          description: "Automated secret rotation job {{ $labels.job_name }} failed. Manual intervention required."
