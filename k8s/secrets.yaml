---
# IMPORTANT: This is a TEMPLATE file
# In production, create secrets using:
# kubectl create secret generic marcus-secrets --from-literal=JWT_SECRET=xxx ...
# Or integrate with external secrets manager (Vault, AWS Secrets Manager)

apiVersion: v1
kind: Secret
metadata:
  name: marcus-secrets
  namespace: marcus-platform
type: Opaque
stringData:
  # REPLACE THESE IN PRODUCTION
  # Use: kubectl create secret generic marcus-secrets \
  #   --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
  #   --from-literal=POSTGRES_PASSWORD=$(openssl rand -base64 32) \
  #   --from-literal=REDIS_PASSWORD=$(openssl rand -base64 32)

  JWT_SECRET: "REPLACE_WITH_SECURE_VALUE"
  JWT_REFRESH_SECRET: "REPLACE_WITH_SECURE_VALUE"

  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_VALUE"
  POSTGRES_USER: "marcus_app"

  REDIS_PASSWORD: "REPLACE_WITH_SECURE_VALUE"

  # OAuth2 credentials (if using external auth)
  OAUTH_CLIENT_ID: ""
  OAUTH_CLIENT_SECRET: ""

  # Encryption key for sensitive data at rest
  ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_KEY"
