---
# Istio Gateway for ingress traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: marcus-gateway
  namespace: marcus-platform
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: marcus-tls
      hosts:
        - "marcus.example.com"
        - "api.marcus.example.com"

    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "marcus.example.com"
        - "api.marcus.example.com"
      tls:
        httpsRedirect: true
---
# VirtualService for routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: marcus-routes
  namespace: marcus-platform
spec:
  hosts:
    - "marcus.example.com"
    - "api.marcus.example.com"
  gateways:
    - marcus-gateway
  http:
    # Health check endpoint (no auth required)
    - match:
        - uri:
            exact: /health
        - uri:
            exact: /ready
      route:
        - destination:
            host: orchestrator.marcus-platform.svc.cluster.local
            port:
              number: 3000
      timeout: 5s

    # Citation analysis endpoints (requires auth)
    - match:
        - uri:
            prefix: /api/citations
      route:
        - destination:
            host: orchestrator.marcus-platform.svc.cluster.local
            port:
              number: 3000
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 60s
      headers:
        request:
          add:
            x-request-start: "%START_TIME%"
        response:
          add:
            x-response-time: "%DURATION%"

    # Authentication endpoints
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: orchestrator.marcus-platform.svc.cluster.local
            port:
              number: 3000
      timeout: 10s

    # Metrics endpoint (internal only via service mesh)
    - match:
        - uri:
            prefix: /metrics
      route:
        - destination:
            host: orchestrator.marcus-platform.svc.cluster.local
            port:
              number: 9090
      timeout: 30s
---
# DestinationRule for orchestrator
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: orchestrator
  namespace: marcus-platform
spec:
  host: orchestrator.marcus-platform.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
---
# DestinationRule for citation agent
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: citation-agent
  namespace: marcus-platform
spec:
  host: citation-agent.marcus-platform.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 1
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-citation-id"
    outlierDetection:
      consecutiveErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
      minHealthPercent: 70
