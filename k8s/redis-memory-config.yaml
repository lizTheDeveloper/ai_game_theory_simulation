# MARCUS 3.1: Redis Memory Configuration
#
# Prevents OOM by setting memory limits and eviction policy
#
# Author: Marcus (Platform Engineer)
# Date: 2025-11-22

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-memory-config
  namespace: marcus
  labels:
    app: redis
    component: cache
data:
  # Redis configuration file
  redis.conf: |
    # ============================================================================
    # MEMORY MANAGEMENT
    # ============================================================================

    # Maximum memory Redis will use (bytes)
    # Set to 80% of container memory limit to leave headroom for:
    # - Redis overhead (internal structures)
    # - Copy-on-write during background saves
    # - AOF rewrite buffers
    #
    # Container limit: 512Mi = 536,870,912 bytes
    # Redis maxmemory: 80% = 429,496,729 bytes (~410Mi)
    maxmemory 429496729

    # Eviction policy: What to do when maxmemory is reached
    #
    # Options:
    # - volatile-lru: Evict least recently used keys with TTL (RECOMMENDED for cache)
    # - allkeys-lru: Evict any least recently used keys (aggressive)
    # - volatile-lfu: Evict least frequently used keys with TTL
    # - allkeys-lfu: Evict any least frequently used keys
    # - volatile-random: Evict random keys with TTL
    # - allkeys-random: Evict any random keys
    # - volatile-ttl: Evict keys with nearest expiration time
    # - noeviction: Return errors when memory limit reached (NOT RECOMMENDED)
    #
    # MARCUS use case: Cache with TTL (agent states, analysis results)
    # Policy: allkeys-lru (evict ANY key, not just those with TTL)
    #         This handles both cached data (with TTL) and locks (no TTL)
    maxmemory-policy allkeys-lru

    # Sampling size for LRU/LFU/TTL algorithms
    # Higher = more accurate but slower eviction
    # Default: 5 (good balance)
    maxmemory-samples 5

    # ============================================================================
    # PERSISTENCE (Disabled for pure cache use case)
    # ============================================================================

    # Disable RDB snapshots (no disk writes)
    # Redis is used as cache only - data loss on restart is acceptable
    save ""

    # Disable AOF (append-only file)
    appendonly no

    # ============================================================================
    # PERFORMANCE TUNING
    # ============================================================================

    # Connection handling
    timeout 300          # Close idle connections after 5 minutes
    tcp-keepalive 60     # Send TCP keepalives every 60 seconds

    # Slow log configuration
    slowlog-log-slower-than 10000  # Log commands taking >10ms
    slowlog-max-len 128            # Keep last 128 slow commands

    # Latency monitoring
    latency-monitor-threshold 100  # Track events taking >100ms

    # ============================================================================
    # NETWORKING
    # ============================================================================

    # Listen on all interfaces (Kubernetes)
    bind 0.0.0.0

    # Protected mode: disabled (Kubernetes network policies handle security)
    protected-mode no

    # Max clients
    maxclients 10000

    # ============================================================================
    # LOGGING
    # ============================================================================

    # Log level: debug, verbose, notice, warning
    loglevel notice

    # ============================================================================
    # LUA SCRIPTING
    # ============================================================================

    # Max Lua script execution time (ms)
    lua-time-limit 5000

---
# Apply ConfigMap to Redis StatefulSet
# This replaces the default redis.conf
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: marcus
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
          - redis-server
          - /etc/redis/redis.conf  # Use custom config
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "256Mi"  # Minimum guaranteed
            cpu: "100m"
          limits:
            memory: "512Mi"  # Maximum allowed (maxmemory = 80% of this)
            cpu: "500m"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
          readOnly: true
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: redis-config
        configMap:
          name: redis-memory-config
          items:
          - key: redis.conf
            path: redis.conf
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi  # Small disk (persistence disabled, used for temp files only)
