# Gitleaks configuration file
# See: https://github.com/gitleaks/gitleaks#configuration

title = "MARCUS 3.0 Gitleaks Config"

# Extend the default rules
[extend]
useDefault = true

# Global allowlist for paths containing documentation examples
[allowlist]
  description = "Allowlist documentation files with example tokens"
  paths = [
    '''src/platform/docs/.*\.md$''',
    '''docs/.*\.md$''',
    '''.*README\.md$''',
    '''.*EXAMPLE.*''',
    '''\.env\..*\.template$''',
    '''\.md$''',
    '''\.txt$''',
  ]
  regexTarget = "match"
