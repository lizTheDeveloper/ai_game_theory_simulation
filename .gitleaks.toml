# Gitleaks configuration file
# See: https://github.com/gitleaks/gitleaks#configuration

title = "MARCUS 3.0 Gitleaks Config"

# Extend the default rules
[extend]
useDefault = true

# Global allowlist for paths containing documentation and test examples
[allowlist]
  description = "Allowlist documentation, test scripts, and example configurations"
  paths = [
    # Documentation
    '''src/platform/docs/.*\.md$''',
    '''docs/.*\.md$''',
    '''.*README\.md$''',
    '''.*EXAMPLE.*''',
    '''\.env\..*\.template$''',
    '''\.md$''',
    '''\.txt$''',
    # Test scripts with example credentials (not real secrets)
    '''scripts/test_marcus_.*\.sh$''',
    '''scripts/test_.*\.sh$''',
    # Kubernetes example manifests (placeholder values only)
    '''k8s/secrets\.yaml$''',
    '''k8s/.*-example\.yaml$''',
    # Backup examples (historical test data, not production secrets)
    '''backups/.*''',
    # Python agent with example database credentials
    '''src/platform/agents/.*\.py$''',
    # Docker and docker-compose files with example credentials
    '''docker-compose.*\.yml$''',
    '''docker-compose.*\.yaml$''',
    # Test files with mock/fake credentials (not production secrets)
    '''.*\.test\.ts$''',
    '''.*\.test\.js$''',
    '''.*\.spec\.ts$''',
    '''.*\.spec\.js$''',
    '''tests/.*''',
    '''__tests__/.*''',
  ]
  # Allowlist specific commits that contain only test/example credentials
  commits = [
    # Initial MARCUS platform setup with example credentials (not production secrets)
    '''e0c84e73de1c89d1c1e22990dea816772dcaccd5''',
    # Test file with fake JWT tokens and test secrets (for unit testing auth)
    '''770c872d111d23620fb29e5ba6b0996d39e28932''',
  ]
  regexTarget = "match"
