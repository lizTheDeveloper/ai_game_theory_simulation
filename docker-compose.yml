# Docker Compose v3.8 (version field deprecated in Compose v2)
# Multi-container setup for MARCUS 3.0 platform

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: marcus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marcus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-citation_integrity}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema initialization will be handled by migrations or orchestrator
      # - ./src/platform/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"  # Using 5433 on host to avoid conflict with native PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marcus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marcus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: marcus-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Using 6380 on host to avoid conflict with native Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marcus-network

  # Citation Integrity Agents (scalable)
  citation-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: ghcr.io/your-org/marcus-citation-agent:latest
    # Note: container_name removed to allow deploy.replicas (multiple instances)
    environment:
      # Worker service configuration (Redis queue-based)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-citation_integrity}
      DATABASE_USER: ${POSTGRES_USER:-marcus}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      AGENT_ID: ${AGENT_ID:-agent_${HOSTNAME}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - marcus-network
    deploy:
      replicas: ${NUM_AGENTS:-3}
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # ORCHESTRATOR ARCHITECTURES
  # ============================================================================
  # MARCUS 3.0 supports TWO orchestration patterns:
  #
  # 1. SPAWN-AGENTS (Legacy) - Orchestrator spawns Python agents internally
  #    - Tightly coupled, single container
  #    - Simpler for development, not recommended for production
  #    - Service: orchestrator-spawn-agents (COMMENTED OUT by default)
  #
  # 2. WORKER SERVICE (Recommended) - Independent worker containers
  #    - Loosely coupled, horizontally scalable
  #    - Production-ready, Kubernetes-native pattern
  #    - Service: citation-worker-orchestrator (ACTIVE by default)
  #
  # See docs/ORCHESTRATOR_ARCHITECTURES.md for detailed comparison
  # ============================================================================

  # ----------------------------------------------------------------------------
  # ARCHITECTURE 1: Spawn-Agents Pattern (LEGACY - commented out)
  # ----------------------------------------------------------------------------
  # Uncomment to use the spawn-agents architecture for development/testing
  #
  # orchestrator-spawn-agents:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.spawn-agents-orchestrator
  #   image: ghcr.io/your-org/marcus-spawn-agents-orchestrator:latest
  #   container_name: marcus-orchestrator-spawn-agents
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-marcus}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-citation_integrity}
  #     REDIS_URL: redis://redis:6379/0
  #     NUM_AGENTS: ${NUM_AGENTS:-3}
  #     API_PORT: 3000
  #     LOG_LEVEL: ${LOG_LEVEL:-INFO}
  #   ports:
  #     - "3003:3000"  # Different port to avoid conflict with worker orchestrator
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - marcus-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ----------------------------------------------------------------------------
  # ARCHITECTURE 2: Worker Service Pattern (RECOMMENDED - active)
  # ----------------------------------------------------------------------------
  citation-worker-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.citation-worker-orchestrator
    image: ghcr.io/your-org/marcus-citation-worker-orchestrator:latest
    container_name: marcus-worker-orchestrator
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-citation_integrity}
      DATABASE_USER: ${POSTGRES_USER:-marcus}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "3002:3000"  # Worker orchestrator API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - marcus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: marcus-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - marcus-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: marcus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_INSTALL_PLUGINS: ''
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - marcus-network
    restart: unless-stopped

  # Loki Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: marcus-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - marcus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: marcus-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - marcus-network
    restart: unless-stopped

  # Jaeger Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: marcus-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    ports:
      - "5775:5775/udp"   # Agent: accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp"   # Agent: accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"   # Agent: accept jaeger.thrift over binary thrift protocol
      - "5778:5778"       # Agent: serve configs
      - "16686:16686"     # Query: serve frontend
      - "14268:14268"     # Collector: accept jaeger.thrift directly from clients
      - "14250:14250"     # Collector: accept model.proto
      - "9411:9411"       # Collector: Zipkin compatible endpoint
    networks:
      - marcus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AlertManager for Alert Routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: marcus-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - marcus-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  jaeger_data:
  alertmanager_data:

networks:
  marcus-network:
    driver: bridge
