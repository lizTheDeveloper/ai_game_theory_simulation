<!DOCTYPE html>
<html>
<head>
    <title>Worker Debug Test</title>
</head>
<body>
    <h1>Check Console for Worker Messages</h1>
    <p>Open browser console (F12) to see debug output</p>
    <button id="test">Initialize Worker</button>

    <script type="module">
        document.getElementById('test').addEventListener('click', async () => {
            console.log('Loading worker client...');

            // Dynamically import the worker client
            const { SimulationWorkerClient } = await import('./src/lib/simulationWorkerClient.ts');

            const client = new SimulationWorkerClient();

            client.on('initialized', (snapshot, startDate) => {
                console.log('=== INITIALIZED EVENT ===');
                console.log('Snapshot:', snapshot);
                console.log('population:', snapshot.population);
                console.log('qualityOfLife:', snapshot.qualityOfLife);
            });

            client.on('update', (delta, month, day) => {
                console.log('=== UPDATE EVENT ===');
                console.log('Delta:', delta);
                console.log('delta.population:', delta.population);
                console.log('delta.qualityOfLife:', delta.qualityOfLife);
            });

            client.init(42000, 'historical', 30000);
        });
    </script>
</body>
</html>
